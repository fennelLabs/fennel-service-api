apiVersion: v1
kind: ConfigMap
metadata:
  name: fennel-api-config
  namespace: fennel-api
data:
  DEBUG: "False"
  ENVIRONMENT: "PRODUCTION"
  ALLOWED_HOSTS: "api.fennellabs.com,localhost,fennel-api-service"
  # Fennel blockchain RPC endpoints (connecting to your existing validators)
  FENNEL_RPC: "ws://fennel-validator-0-b4ps-v2.fennel-production.svc.cluster.local:9944"
  FENNEL_VALIDATOR_RPC: "ws://fennel-validator-0-b4ps-v2.fennel-production.svc.cluster.local:9944"
  FENNEL_VALIDATOR_HTTP_RPC: "http://fennel-validator-0-b4ps-v2.fennel-production.svc.cluster.local:9944"
  # Database configuration
  POSTGRES_DB: "fennelapi"
  POSTGRES_USER: "fennelapi"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  # External services (placeholder - update with actual endpoints)
  FENNEL_CLI_IP: "https://cli.fennellabs.com"
  FENNEL_SUBSERVICE_IP: "https://subservice.fennellabs.com"
---
